version: "3.9"

services:
  # --- Development Services ---
  
  # Java Maven Dev - Hot Reload Development Environment
  java-maven-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: co3065-dev
    hostname: dev
    working_dir: /app
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    ports:
      - "8090:8090"  # API Service (Spring Boot default)
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

      # MinIO Storage
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=cv-files
      - MINIO_AVATAR_BUCKET_NAME=cv-avatars
      
      # RabbitMQ
      - SPRING_RABBITMQ_HOST=co3065-rabbitmq-dev
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

      # Gemini AI Integration (see application.yml lines 59-71)
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - GEMINI_ENDPOINT=${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com/v1/models}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.7}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-2048}
      - GEMINI_TIMEOUT_MS=${GEMINI_TIMEOUT_MS:-30000}
      - GEMINI_KEY_STRATEGY=${GEMINI_KEY_STRATEGY:-ROUND_ROBIN}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-3}
      - GEMINI_RETRY_DELAY_MS=${GEMINI_RETRY_DELAY_MS:-1000}
      - GEMINI_MAX_RETRY_DELAY_MS=${GEMINI_MAX_RETRY_DELAY_MS:-10000}
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped

  # --- Infrastructure Services ---
  
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: co3065-postgres-dev
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G

  # Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: co3065-rabbitmq-dev
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Object Storage
  minio:
    image: minio/minio:latest
    container_name: co3065-minio-dev
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # MinIO Bucket Initialization
  minio-init:
    image: minio/mc:latest
    container_name: co3065-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo '📦 Initializing MinIO buckets...';
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/cv-files --ignore-existing;
      /usr/bin/mc anonymous set download myminio/cv-files;
      /usr/bin/mc mb myminio/cv-avatars --ignore-existing;
      /usr/bin/mc anonymous set download myminio/cv-avatars;
      echo '✅ MinIO buckets ready!';
      exit 0;
      "

  # --- Management Interfaces ---
  
  # PgAdmin - Database Management
  pgadmin:
    image: dpage/pgadmin4:7.8
    container_name: co3065-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin

volumes:
  postgres_data_dev:
  pgadmin_data_dev:
  minio_data_dev:
  rabbitmq_data_dev:
